<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlayer AI - Search & Learn</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { color: var(--primary); }

    .search-box {
      display: flex;
      max-width: 700px;
      margin: 0 auto 1.5rem auto;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }

    button {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .container { display: flex; gap: 1.5rem; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; }
    .left-panel { flex: 3; min-width: 320px; }
    .right-panel { flex: 2; min-width: 300px; background: var(--card); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--border); }

    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 10px; overflow: hidden; }
    .video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

    /* Search Results Grid */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .video-card img { width: 100%; height: 100px; object-fit: cover; }
    .video-card-body { padding: 0.5rem; }
    
    /* Fixed line-clamp rule with standard property */
    .video-card-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: white;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }
    
    .video-card-channel { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

    .actions { margin-top: 1rem; display: flex; gap: 1rem; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

    .summary-box { margin-top: 1rem; color: var(--muted); line-height: 1.6; }
    .summary-box h3 { color: var(--primary); margin: 0.8rem 0 0.3rem 0; }
    .summary-box ul { padding-left: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <h1>🎓 EduPlayer AI</h1>
    <p>Search topics, watch videos, and get instant AI study notes</p>
  </header>

  <!-- Search YouTube Topics -->
  <div class="search-box">
    <input type="text" id="queryInput" placeholder="Search any educational topic (e.g., Python OOP, Quantum Physics)..." onkeydown="if(event.key==='Enter') searchYouTube()" />
    <button onclick="searchYouTube()">🔍 Search</button>
  </div>

  <div class="container">
    <div class="left-panel">
      <!-- Player -->
      <div class="video-wrapper">
        <iframe id="player" src="about:blank" allowfullscreen></iframe>
      </div>

      <div class="actions">
        <button id="sumBtn" onclick="summarizeVideo()" disabled>✨ Summarize Playing Video</button>
        <button id="pdfBtn" class="btn-outline" onclick="downloadPDF()" style="display:none;">📄 Download PDF</button>
      </div>

      <!-- Search Results -->
      <h3 style="margin-top: 1.5rem; color: var(--muted);">Search Results</h3>
      <div id="searchResults" class="results-grid">
        <p style="color: var(--muted); font-size: 0.9rem;">Type a query above to discover videos.</p>
      </div>
    </div>

    <!-- AI Summary Sidebar -->
    <div class="right-panel">
      <h2>AI Study Notes</h2>
      <div id="output" class="summary-box">
        <p>Select a video and click <strong>"Summarize Playing Video"</strong> to generate key notes.</p>
      </div>
    </div>
  </div>

  <script>
    let currentVideoId = '';
    let currentVideoTitle = '';
    let summaryData = null;

    // Helper to escape special HTML characters in dynamic attributes
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Search YouTube API
    async function searchYouTube() {
      const q = document.getElementById('queryInput').value.trim();
      if (!q) return;

      const container = document.getElementById('searchResults');
      container.innerHTML = '<p style="color: var(--muted);">Searching YouTube...</p>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (data.success && data.videos.length > 0) {
          container.innerHTML = data.videos.map(v => `
            <div class="video-card" onclick="selectVideo('${v.videoId}', '${escapeHtml(v.title)}')">
              <img src="${v.thumbnail}" alt="${escapeHtml(v.title)}" />
              <div class="video-card-body">
                <div class="video-card-title">${v.title}</div>
                <div class="video-card-channel">${v.channelTitle}</div>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color: red;">No videos found.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="color: red;">Search failed. Check your YouTube API Key.</p>';
      }
    }

    // Play Selected Video
    function selectVideo(videoId, videoTitle) {
      currentVideoId = videoId;
      currentVideoTitle = videoTitle || `Video ID: ${videoId}`;
      document.getElementById('player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      document.getElementById('sumBtn').disabled = false;
      document.getElementById('pdfBtn').style.display = 'none';
      document.getElementById('output').innerHTML = '<p>Video selected! Click <strong>"Summarize Playing Video"</strong> when ready.</p>';
    }

    // Summarize Video via Gemini
    async function summarizeVideo() {
      const out = document.getElementById('output');
      out.innerHTML = '<p>⏳ Fetching transcript and generating study notes with Gemini...</p>';

      try {
        const res = await fetch('/api/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoId: currentVideoId })
        });

        const result = await res.json();
        if (result.success) {
          summaryData = result.data;
          out.innerHTML = `
            <h3>📌 Purpose</h3><p>${summaryData.purpose}</p>
            <h3>📝 Summary</h3><p>${summaryData.summary}</p>
            <h3>💡 Key Takeaways</h3>
            <ul>${summaryData.keyPoints.map(p => `<li>${p}</li>`).join('')}</ul>
          `;
          document.getElementById('pdfBtn').style.display = 'inline-block';
        } else {
          out.innerHTML = `<p style="color:red">Error: ${result.error}</p>`;
        }
      } catch (e) {
        out.innerHTML = '<p style="color:red">Server connection failed.</p>';
      }
    }

    // Download PDF
    async function downloadPDF() {
      if (!summaryData) return;
      const res = await fetch('/api/generate-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: currentVideoTitle || `Video ID: ${currentVideoId}`,
          purpose: summaryData.purpose,
          summary: summaryData.summary,
          keyPoints: summaryData.keyPoints
        })
      });

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `study-notes-${currentVideoId}.pdf`;
      a.click();
    }
  </script>
</body>
</html>
